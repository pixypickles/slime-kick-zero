<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#163850">
  <title>スライム・キック・ゼロ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="startScreen" class="screen start-screen">
      <div class="title-card">
        <p class="eyebrow">SLIME KICK ZERO</p>
        <h1>スライム・キック・ゼロ</h1>
        <p>能力バトルが終わり、スライムに自我が芽生えた時代。人々は蹴ることをやめ、道具と知恵で村へ導く競技を始めました。</p>
        <button id="startButton" class="primary">試合開始</button>
        <details>
          <summary>遊び方</summary>
          <p>左下のスティックで移動。Aで道具、Bでキャラ交代、Cで設置物。3点先取です。</p>
          <p>盾は進路変更、棒は中ジャンプ、水鉄砲は約2回に1回小ジャンプ。リンゴ・バケツ・ジャンプ台も活用してください。</p>
        </details>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <canvas id="gameCanvas" width="1280" height="720" aria-label="ゲーム画面"></canvas>
      <div id="hud">
        <div class="score"><span id="blueScore">0</span><span>―</span><span id="redScore">0</span></div>
        <div id="roleLabel" class="role-label">盾役</div>
        <button id="restartButton" class="small">やり直す</button>
      </div>
      <div id="controls">
        <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
        <div class="buttons">
          <button id="buttonA" class="game-button a">A<br><span>盾</span></button>
          <button id="buttonB" class="game-button b">B<br><span>交代</span></button>
          <button id="buttonC" class="game-button c">C<br><span>リンゴ</span></button>
        </div>
      </div>
      <div id="message" class="message hidden"></div>
    </section>
  </main>
  <script type="module" src="js/game.js"></script>
</body>
</html>
