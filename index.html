<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>SLIME KICK ZERO v0.11</title>
<style>
  :root{--ui:#fff7de;--ink:#1a1a1a;--grass:#3f8f3f;--path:#e9d7a8;--wall:#244b2b;--accent:#ffcc3d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* スマホで長押ししても選択・コピー・翻訳メニューを出さない */
  #game,#controls,#dpad,.dir,#topbar,canvas{
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
  }
  .dir{-webkit-user-drag:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#18261d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  body{display:flex;justify-content:center;align-items:center}
  #app{width:min(100vw,720px);height:100dvh;min-height:100%;background:#243d2a;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;display:none}
  .screen.active{display:flex}
  #title{align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:linear-gradient(#8fd2ff,#e9f8ff 35%,#7dbd58 35%,#4f8b42)}
  .card{width:min(92%,520px);background:rgba(255,255,255,.92);border:5px solid #222;border-radius:24px;padding:22px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.24)}
  h1{font-size:clamp(28px,7vw,52px);line-height:1;margin:4px 0 10px;letter-spacing:.04em}
  .sub{font-weight:800;margin-bottom:18px}
  .note{font-size:14px;line-height:1.7;margin:14px 0 20px}
  button{font:inherit;font-weight:900;border:4px solid #222;background:var(--accent);border-radius:16px;padding:14px 22px;box-shadow:0 6px 0 #8b6b00;cursor:pointer}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #8b6b00}
  #game{flex-direction:column;background:#203a27}
  #topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--ui);border-bottom:4px solid #222;font-weight:900;z-index:2}
  #canvasWrap{position:relative;flex:1;min-height:0;background:#1d3022;display:flex;align-items:center;justify-content:center;padding:8px}
  canvas{display:block;background:#d7c28f;border:5px solid #111;border-radius:12px;max-width:100%;max-height:100%;image-rendering:auto;touch-action:none}
  #controls{height:150px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#efe3bd;border-top:4px solid #222}
  #dpad{position:relative;width:132px;height:132px;margin:auto}
  .dir{position:absolute;width:46px;height:46px;padding:0;border-radius:13px;background:#fff;border:4px solid #222;box-shadow:0 4px 0 #777;font-size:22px}
  .dir:active{box-shadow:0 1px 0 #777}
  #up{left:43px;top:0}#left{left:0;top:43px}#right{right:0;top:43px}#down{left:43px;bottom:0}
  #actionPanel{display:flex;align-items:center;justify-content:center;gap:14px;flex-direction:column;text-align:center;font-weight:800;line-height:1.35}
  #actionBtn{width:82px;height:82px;border-radius:50%;padding:0;background:#68d8ff;box-shadow:0 6px 0 #2787a8;font-size:28px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #actionBtn:active{box-shadow:0 2px 0 #2787a8}
  #actionHint{font-size:13px}
  .kbd{display:inline-block;padding:2px 6px;border:2px solid #222;border-radius:6px;background:white;margin:0 2px}
  @media (max-height:620px){#controls{height:126px}#dpad{transform:scale(.86)}#topbar{height:46px}}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen active">
    <div class="card">
      <h1>SLIME KICK ZERO</h1>
      <div class="sub">v0.11　4方向の水鉄砲</div>
      <div class="note">
        人とスライムが、通路中央の見えないレール上を動きます。<br>
        スライムは通路を気ままに進み、交差点で方向を選びます。<br>
        Aボタンで、音のしない水鉄砲を撃てます。<br>
        水は通路に沿ってゆっくり進み、茂みに当たると消えます。<br>
        この版では、まだスライムへの効果・発見判定・得点はありません。
      </div>
      <button id="startBtn" type="button">試合開始</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div id="topbar">
      <span>v0.11 4方向の水鉄砲</span>
      <button id="backBtn" type="button" style="padding:7px 12px;box-shadow:none;border-width:3px">戻る</button>
    </div>
    <div id="canvasWrap"><canvas id="gameCanvas" width="624" height="432"></canvas></div>
    <div id="controls">
      <div id="dpad">
        <button class="dir" id="up" data-dir="up">▲</button>
        <button class="dir" id="left" data-dir="left">◀</button>
        <button class="dir" id="right" data-dir="right">▶</button>
        <button class="dir" id="down" data-dir="down">▼</button>
      </div>
      <div id="actionPanel">
        <button id="actionBtn" type="button" aria-label="水鉄砲">A</button>
        <div id="actionHint">水鉄砲<br>PC：<span class="kbd">J</span> / <span class="kbd">Space</span></div>
      </div>
    </div>
  </section>
</div>
<script>
(() => {
  'use strict';
  const title = document.getElementById('title');
  const game = document.getElementById('game');
  const startBtn = document.getElementById('startBtn');
  const backBtn = document.getElementById('backBtn');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const COLS = 13, ROWS = 9, TILE = 48;
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;

  // 1=草ブロック、0=通路。外周と偶数座標の交点に規則正しく草を配置。
  const map = Array.from({length:ROWS}, (_, y) => Array.from({length:COLS}, (_, x) => {
    if (x === 0 || y === 0 || x === COLS-1 || y === ROWS-1) return 1;
    if (x % 2 === 0 && y % 2 === 0) return 1;
    return 0;
  }));

  const player = {
    x: TILE * 1.5,
    y: TILE * 1.5,
    radius: 15,
    speed: 165,
    facing: 'down',
    moveDir: null,
    queuedDir: null,
    turnTarget: null,
    lastMoveDir: 'up'
  };

  const slime = {
    x: TILE * 11.5,
    y: TILE * 7.5,
    facing: 'left',
    moveDir: 'left',
    wobble: 0,
    state: 'idle',
    stateTime: 0,
    idleDuration: 0.55,
    hopDuration: 0.46,
    hopFromX: TILE * 11.5,
    hopFromY: TILE * 7.5,
    hopToX: TILE * 10.5,
    hopToY: TILE * 7.5,
    hopProgress: 0,
    landingPulse: 0
  };

  const waterShots = [];
  let waterCooldown = 0;

  const keys = {up:false,down:false,left:false,right:false};
  const pressOrder = [];
  const DIRS = {
    up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
  };
  let running = false;
  let last = performance.now();

  function setScreen(which){
    title.classList.toggle('active', which === 'title');
    game.classList.toggle('active', which === 'game');
  }

  function resetPlayer(){
    player.x = TILE * 1.5;
    player.y = TILE * 1.5;
    player.facing = 'down';
    player.moveDir = null;
    player.queuedDir = null;
    player.turnTarget = null;
    player.lastMoveDir = 'up';
    pressOrder.length = 0;
  }

  function resetSlime(){
    slime.x = TILE * 11.5;
    slime.y = TILE * 7.5;
    slime.facing = 'left';
    slime.moveDir = 'left';
    slime.wobble = 0;
    slime.state = 'idle';
    slime.stateTime = 0;
    slime.idleDuration = 0.45 + Math.random() * 0.75;
    slime.hopProgress = 0;
    slime.landingPulse = 0;
    slime.hopFromX = slime.x;
    slime.hopFromY = slime.y;
    slime.hopToX = slime.x;
    slime.hopToY = slime.y;
    waterShots.length = 0;
    waterCooldown = 0;
  }

  function cellFromPosition(x,y){
    return {x:Math.floor(x/TILE),y:Math.floor(y/TILE)};
  }
  function cellCenterX(cx){return (cx+.5)*TILE;}
  function cellCenterY(cy){return (cy+.5)*TILE;}
  function isOpenCell(cx,cy){return !!map[cy] && map[cy][cx]===0;}
  function canLeaveCell(cx,cy,dir){
    const d=DIRS[dir];
    return !!d && isOpenCell(cx+d.x,cy+d.y);
  }
  function opposite(a,b){
    if(!a||!b)return false;
    const da=DIRS[a],db=DIRS[b];
    return da.x===-db.x && da.y===-db.y;
  }
  function newestHeldDirection(){
    for(let i=pressOrder.length-1;i>=0;i--){
      if(keys[pressOrder[i]]) return pressOrder[i];
    }
    return null;
  }
  function nearCellCenter(x,y,tolerance){
    const c=cellFromPosition(x,y);
    return Math.abs(x-cellCenterX(c.x))<=tolerance && Math.abs(y-cellCenterY(c.y))<=tolerance;
  }

  function isPerpendicular(a,b){
    if(!a||!b) return false;
    const da=DIRS[a],db=DIRS[b];
    return da.x*db.x+da.y*db.y===0;
  }

  function findTurnTarget(dir, turnDir){
    if(!dir||!turnDir||!isPerpendicular(dir,turnDir)) return null;
    const d=DIRS[dir];
    let c=cellFromPosition(player.x,player.y);
    // 現在地から進行方向へ最大3マス先まで、曲がれる交差点を予約する。
    for(let i=0;i<4;i++){
      const cx=cellCenterX(c.x), cy=cellCenterY(c.y);
      const ahead=(dir==='right' ? cx>=player.x-2 : dir==='left' ? cx<=player.x+2 : dir==='down' ? cy>=player.y-2 : cy<=player.y+2);
      if(ahead && canLeaveCell(c.x,c.y,turnDir)){
        const dist=Math.abs(cx-player.x)+Math.abs(cy-player.y);
        if(dist<=TILE*1.15) return {x:cx,y:cy,cx:c.x,cy:c.y,dir:turnDir};
      }
      const nx=c.x+d.x, ny=c.y+d.y;
      if(!isOpenCell(nx,ny)) break;
      c={x:nx,y:ny};
    }
    return null;
  }

  function availableDirections(cx,cy){
    return Object.keys(DIRS).filter(dir=>canLeaveCell(cx,cy,dir));
  }

  function chooseSlimeDirection(cx,cy){
    const open=availableDirections(cx,cy);
    if(!open.length) return null;
    const reverse={up:'down',down:'up',left:'right',right:'left'}[slime.moveDir];
    let choices=open.filter(dir=>dir!==reverse);
    if(!choices.length) choices=open;
    // 直進を少し優先し、気まぐれすぎて落ち着かない動きを防ぐ。
    if(choices.includes(slime.moveDir) && Math.random()<0.58) return slime.moveDir;
    return choices[Math.floor(Math.random()*choices.length)];
  }

  function beginSlimeHop(){
    const cell=cellFromPosition(slime.x,slime.y);
    slime.x=cellCenterX(cell.x);
    slime.y=cellCenterY(cell.y);
    const next=chooseSlimeDirection(cell.x,cell.y);
    if(!next){
      slime.state='idle';
      slime.stateTime=0;
      slime.idleDuration=.6+Math.random()*.8;
      return;
    }
    const d=DIRS[next];
    slime.moveDir=next;
    slime.facing=next;
    slime.hopFromX=slime.x;
    slime.hopFromY=slime.y;
    slime.hopToX=cellCenterX(cell.x+d.x);
    slime.hopToY=cellCenterY(cell.y+d.y);
    slime.hopProgress=0;
    slime.hopDuration=.42+Math.random()*.10;
    slime.state='hop';
    slime.stateTime=0;
  }

  function updateSlime(dt){
    slime.wobble += dt * (slime.state==='idle' ? 2.2 : 5.5);
    slime.landingPulse=Math.max(0,slime.landingPulse-dt*4.5);
    slime.stateTime+=dt;

    if(slime.state==='idle'){
      if(slime.stateTime>=slime.idleDuration) beginSlimeHop();
      return;
    }

    if(slime.state==='hop'){
      slime.hopProgress=Math.min(1,slime.stateTime/slime.hopDuration);
      const t=slime.hopProgress;
      // 滑るのではなく、1マスずつ小さく跳ねて進む。
      const ease=t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      slime.x=slime.hopFromX+(slime.hopToX-slime.hopFromX)*ease;
      slime.y=slime.hopFromY+(slime.hopToY-slime.hopFromY)*ease;
      if(t>=1){
        slime.x=slime.hopToX;
        slime.y=slime.hopToY;
        slime.state='idle';
        slime.stateTime=0;
        // ときどき長めにぼんやりする。
        slime.idleDuration=Math.random()<.22 ? .9+Math.random()*1.0 : .22+Math.random()*.55;
        slime.landingPulse=1;
      }
    }
  }

  function getMuzzlePosition(){
    // drawPlayer() の縮尺込みで、見えている銃口の先端に合わせる。
    if(player.facing==='right') return {x:player.x+31,y:player.y+6};
    if(player.facing==='left')  return {x:player.x-31,y:player.y+6};
    if(player.facing==='down')  return {x:player.x+7,y:player.y+25};
    return {x:player.x+7,y:player.y-27};
  }

  function fireWater(){
    if(!running || waterCooldown>0) return;
    const dir=player.facing || 'down';
    const d=DIRS[dir];
    const muzzle=getMuzzlePosition();
    waterShots.push({
      x:muzzle.x,
      y:muzzle.y,
      vx:d.x*92,
      vy:d.y*92,
      dir,
      life:3.2,
      phase:Math.random()*Math.PI*2
    });
    waterCooldown=.38;
  }

  function updateWater(dt){
    waterCooldown=Math.max(0,waterCooldown-dt);
    for(let i=waterShots.length-1;i>=0;i--){
      const shot=waterShots[i];
      shot.life-=dt;
      shot.phase+=dt*10;
      const nx=shot.x+shot.vx*dt;
      const ny=shot.y+shot.vy*dt;
      const c=cellFromPosition(nx,ny);
      if(shot.life<=0 || !isOpenCell(c.x,c.y)){
        waterShots.splice(i,1);
        continue;
      }
      shot.x=nx;shot.y=ny;
    }
  }

  function update(dt){
    updateSlime(dt);
    updateWater(dt);
    const desired=newestHeldDirection();
    if(desired){
      player.facing=desired;
      player.queuedDir=desired;
    }

    let cell=cellFromPosition(player.x,player.y);
    const cx=cellCenterX(cell.x),cy=cellCenterY(cell.y);

    if(!player.moveDir){
      if(desired && canLeaveCell(cell.x,cell.y,desired)){
        player.moveDir=desired;
        player.lastMoveDir=desired;
      }else if(desired && player.lastMoveDir && isPerpendicular(player.lastMoveDir,desired)){
        player.moveDir=player.lastMoveDir;
        player.turnTarget=findTurnTarget(player.moveDir,desired);
      }else{
        return;
      }
    }

    if(desired && opposite(player.moveDir,desired)){
      player.moveDir=desired;
      player.lastMoveDir=desired;
      player.turnTarget=null;
    }else if(desired && isPerpendicular(player.moveDir,desired)){
      const t=findTurnTarget(player.moveDir,desired);
      if(t) player.turnTarget=t;
    }else if(desired===player.moveDir){
      player.turnTarget=null;
    }

    // 予約がなければ、ボタンを離した時点で停止。
    if(!desired && !player.turnTarget){
      player.moveDir=null;
      return;
    }

    // レール中央へ素早く吸着。
    const railPull=Math.min(1,dt*24);
    if(player.moveDir==='left'||player.moveDir==='right') player.y+=(cy-player.y)*railPull;
    else player.x+=(cx-player.x)*railPull;

    let remaining=player.speed*dt;
    while(remaining>0.001 && player.moveDir){
      cell=cellFromPosition(player.x,player.y);
      const d=DIRS[player.moveDir];

      if(player.turnTarget){
        const axisPos=d.x?player.x:player.y;
        const axisTarget=d.x?player.turnTarget.x:player.turnTarget.y;
        const dist=Math.abs(axisTarget-axisPos);
        const travel=Math.min(remaining,dist);
        player.x+=d.x*travel;player.y+=d.y*travel;remaining-=travel;
        if(dist<=travel+.01){
          player.x=player.turnTarget.x;player.y=player.turnTarget.y;
          player.moveDir=player.turnTarget.dir;
          player.lastMoveDir=player.moveDir;
          player.facing=player.moveDir;
          player.turnTarget=null;
          continue;
        }
        break;
      }

      const centerX=cellCenterX(cell.x),centerY=cellCenterY(cell.y);
      const targetBoundaryX=d.x>0?(cell.x+1)*TILE:d.x<0?cell.x*TILE:player.x;
      const targetBoundaryY=d.y>0?(cell.y+1)*TILE:d.y<0?cell.y*TILE:player.y;
      const distanceToBoundary=d.x?Math.abs(targetBoundaryX-player.x):Math.abs(targetBoundaryY-player.y);
      const travel=Math.min(remaining,distanceToBoundary+.001);
      player.x+=d.x*travel;player.y+=d.y*travel;remaining-=travel;

      if(travel>=distanceToBoundary-.002){
        const nextX=cell.x+d.x,nextY=cell.y+d.y;
        if(!isOpenCell(nextX,nextY)){
          player.x=centerX;player.y=centerY;player.moveDir=null;break;
        }
        player.x+=d.x*.01;player.y+=d.y*.01;
      }
    }
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  }

  function drawGround(){
    ctx.fillStyle = '#b9d987';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(map[y][x]!==0) continue;
      const px=x*TILE, py=y*TILE;
      ctx.fillStyle=(x+y)%2?'#e7d7ae':'#dfcca0';
      ctx.fillRect(px,py,TILE,TILE);
      const exits=['up','down','left','right'].filter(dir=>canLeaveCell(x,y,dir)).length;
      if(exits>=3){
        ctx.fillStyle='rgba(255,248,210,.36)';
        ctx.beginPath();ctx.arc(px+TILE/2,py+TILE/2,8,0,Math.PI*2);ctx.fill();
      }
    }
  }

  function drawBush(x,y){
    const px=x*TILE, py=y*TILE;
    const top=py-7;
    const bottom=py+TILE-3;
    ctx.save();
    // 地面に接する濃い影。茂みが通路上へ浮いて見えないようにする。
    ctx.fillStyle='rgba(0,0,0,.16)';
    ctx.beginPath();ctx.ellipse(px+TILE/2,bottom-1,TILE*.42,7,0,0,Math.PI*2);ctx.fill();
    // 丸い葉の塊。衝突判定は1マスだが、見た目は少し上へ張り出す。
    ctx.fillStyle='#17652f';ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.lineJoin='round';
    roundedRect(px+3,top+8,TILE-6,TILE-9,12);ctx.fill();ctx.stroke();
    ctx.beginPath();
    ctx.arc(px+13,top+14,10,0,Math.PI*2);
    ctx.arc(px+25,top+9,12,0,Math.PI*2);
    ctx.arc(px+37,top+15,10,0,Math.PI*2);
    ctx.fill();ctx.stroke();
    // 葉のハイライト
    ctx.strokeStyle='#48b94f';ctx.lineWidth=3.2;ctx.lineCap='round';
    for(let i=0;i<4;i++){
      const gx=px+12+i*8;
      ctx.beginPath();ctx.moveTo(gx,bottom-9);ctx.quadraticCurveTo(gx-3,py+19,gx+1,top+15+(i%2)*3);ctx.stroke();
    }
    ctx.restore();
  }

  function drawGunLocal(anchorX,anchorY,angle,showHandle=true){
    ctx.save();
    ctx.translate(anchorX,anchorY);
    ctx.rotate(angle);
    ctx.fillStyle='#43c8f0';ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.lineJoin='round';
    roundedRect(-8,-7,22,14,5);ctx.fill();ctx.stroke();
    ctx.fillStyle='#197ca3';
    roundedRect(12,-3,10,6,2);ctx.fill();ctx.stroke();
    if(showHandle){
      ctx.fillStyle='#2a91b8';
      roundedRect(-3,5,7,10,2);ctx.fill();ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer(){
    const x=player.x,y=player.y;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(.72,.72);
    ctx.translate(-x,-y);

    // shadow
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,y+18,17,7,0,0,Math.PI*2);ctx.fill();

    // 上向きでは水鉄砲を身体の向こう側に描き、胴体と頭で大部分を隠す。
    if(player.facing==='up'){
      drawGunLocal(x+10,y-5,-Math.PI/2,false);
    }

    // body
    ctx.fillStyle='#5aa8ff';ctx.strokeStyle='#111';ctx.lineWidth=5;
    roundedRect(x-13,y-4,26,31,10);ctx.fill();ctx.stroke();
    // legs
    ctx.lineCap='round';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(x-7,y+23);ctx.lineTo(x-9,y+34);ctx.moveTo(x+7,y+23);ctx.lineTo(x+9,y+34);ctx.stroke();
    // arms
    ctx.beginPath();ctx.moveTo(x-12,y+4);ctx.lineTo(x-22,y+14);ctx.moveTo(x+12,y+4);ctx.lineTo(x+22,y+14);ctx.stroke();
    // head
    ctx.fillStyle='#ffd7b0';ctx.beginPath();ctx.arc(x,y-17,17,0,Math.PI*2);ctx.fill();ctx.stroke();

    // 上向きは後頭部なので目を描かない。
    if(player.facing!=='up'){
      let ex=0,ey=0;
      if(player.facing==='left')ex=-3;
      if(player.facing==='right')ex=3;
      if(player.facing==='down')ey=2;
      ctx.fillStyle='#111';
      ctx.beginPath();ctx.arc(x-6+ex,y-19+ey,2.8,0,Math.PI*2);ctx.arc(x+6+ex,y-19+ey,2.8,0,Math.PI*2);ctx.fill();
    }

    // 横向きは完全な鏡写し。持ち手は必ず下側。
    if(player.facing==='right'){
      drawGunLocal(x+20,y+9,0,true);
    }else if(player.facing==='left'){
      drawGunLocal(x-20,y+9,Math.PI,true);
    }else if(player.facing==='down'){
      // 正面では身体の手前。持ち手は胴体の陰に隠して描かない。
      drawGunLocal(x+10,y+12,Math.PI/2,false);
    }
    // 上向きの銃はすでに身体の後ろへ描画済み。

    ctx.restore();
  }

  function drawSlime(){
    const x=slime.x,y=slime.y;
    const hopLift=slime.state==='hop' ? Math.sin(slime.hopProgress*Math.PI)*13 : 0;
    const idleBob=slime.state==='idle' ? Math.sin(slime.wobble)*.55 : 0;
    const bodyY=y-hopLift+idleBob;
    const landing=slime.landingPulse;
    const air=Math.sin(slime.hopProgress*Math.PI);

    // 影は地面に残す。跳ぶほど少し小さく薄くなる。
    ctx.save();
    ctx.fillStyle=`rgba(0,0,0,${0.17-air*0.07})`;
    ctx.beginPath();
    ctx.ellipse(x,y+18,18-air*3.5,5.8-air*1.2,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // 空中では縦に伸び、着地時は横にぷにっと潰れる。
    let scaleX=1-air*.07+landing*.13;
    let scaleY=1+air*.10-landing*.11;
    if(slime.state==='idle' && landing<=0){
      scaleX+=Math.sin(slime.wobble*2)*.008;
      scaleY-=Math.sin(slime.wobble*2)*.008;
    }

    ctx.save();
    ctx.translate(x,bodyY);
    ctx.scale(scaleX,scaleY);

    // 凹凸のない、丸くて下側が少し広い水色スライム。
    ctx.fillStyle='#72d9f4';
    ctx.strokeStyle='#111';
    ctx.lineWidth=5;
    ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(-21,11);
    ctx.bezierCurveTo(-22,-4,-15,-18,0,-20);
    ctx.bezierCurveTo(15,-18,22,-4,21,11);
    ctx.bezierCurveTo(16,20,7,22,0,21);
    ctx.bezierCurveTo(-8,22,-17,20,-21,11);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 地面に接している部分だけ少し濃くし、透明なゼリー感を出す。
    // ジャンプで浮くほど薄くなり、空中ではほぼ見えなくなる。
    const baseAlpha=Math.max(0,.30-air*.34);
    if(baseAlpha>0.01){
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-18,10);
      ctx.bezierCurveTo(-13,17,-6,19,0,19);
      ctx.bezierCurveTo(7,19,14,17,18,10);
      ctx.bezierCurveTo(10,13,-10,13,-18,10);
      ctx.closePath();
      ctx.fillStyle=`rgba(24,139,201,${baseAlpha})`;
      ctx.fill();
      ctx.restore();
    }

    // 透明感のある光沢。画像ではなくCanvas図形。
    ctx.fillStyle='rgba(255,255,255,.78)';
    ctx.beginPath();
    ctx.ellipse(-8,-11,5.3,3.1,-.55,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.arc(-2,-15,1.5,0,Math.PI*2);
    ctx.fill();

    // 白目は使わず、黒目＋ごく小さな光だけ。4方向の向きを表現。
    if(slime.facing==='up'){
      // 上向きは後ろ姿。顔は描かず、背中の艶だけ見せる。
      ctx.fillStyle='rgba(255,255,255,.34)';
      ctx.beginPath();ctx.ellipse(7,-7,3.2,1.7,.45,0,Math.PI*2);ctx.fill();
    }else{
      let eyes;
      if(slime.facing==='left') eyes=[[-11,-5],[-3,-6]];
      else if(slime.facing==='right') eyes=[[3,-6],[11,-5]];
      else eyes=[[-7,-5],[7,-5]];
      for(const [ex,ey] of eyes){
        ctx.fillStyle='#111';
        ctx.beginPath();ctx.arc(ex,ey,3.25,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.92)';
        ctx.beginPath();ctx.arc(ex-.9,ey-1.05,.82,0,Math.PI*2);ctx.fill();
      }
      ctx.strokeStyle='#111';
      ctx.lineWidth=2.4;
      ctx.lineCap='round';
      ctx.beginPath();
      if(slime.facing==='left') ctx.arc(-7,5,4.3,.12*Math.PI,.80*Math.PI);
      else if(slime.facing==='right') ctx.arc(7,5,4.3,.20*Math.PI,.88*Math.PI);
      else ctx.arc(0,5,5,.15*Math.PI,.85*Math.PI);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawWater(){
    for(const shot of waterShots){
      ctx.save();
      ctx.translate(shot.x,shot.y+Math.sin(shot.phase)*1.2);
      const angle=Math.atan2(shot.vy,shot.vx);
      ctx.rotate(angle);
      // 見失いにくい、ゆっくり飛ぶ水滴と短い尾。
      ctx.strokeStyle='rgba(80,205,255,.5)';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(-5,0);ctx.stroke();
      ctx.fillStyle='#77dcff';ctx.strokeStyle='#086a98';ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.moveTo(8,0);ctx.quadraticCurveTo(0,-7,-6,0);ctx.quadraticCurveTo(0,7,8,0);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(0,-2,1.5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGround();

    // 見下ろし型の奥行き表現：足元のY座標で茂みと人を並べ替える。
    // 人より下側の茂みは後から描き、下半身を自然に隠す。
    const layers=[];
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(map[y][x]===1){
        layers.push({depth:(y+1)*TILE,kind:'bush',x,y});
      }
    }
    for(const shot of waterShots) layers.push({depth:shot.y,kind:'water',shot});
    layers.push({depth:player.y+19,kind:'player'});
    layers.push({depth:slime.y+19,kind:'slime'});
    layers.sort((a,b)=>a.depth-b.depth || (a.kind==='player'?-1:1));
    for(const item of layers){
      if(item.kind==='player') drawPlayer();
      else if(item.kind==='slime') drawSlime();
      else if(item.kind==='water'){
        const original=waterShots;
        const shot=item.shot;
        ctx.save();ctx.translate(shot.x,shot.y+Math.sin(shot.phase)*1.2);
        const angle=Math.atan2(shot.vy,shot.vx);ctx.rotate(angle);
        ctx.strokeStyle='rgba(80,205,255,.5)';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(-5,0);ctx.stroke();
        ctx.fillStyle='#77dcff';ctx.strokeStyle='#086a98';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(8,0);ctx.quadraticCurveTo(0,-7,-6,0);ctx.quadraticCurveTo(0,7,8,0);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(0,-2,1.5,0,Math.PI*2);ctx.fill();ctx.restore();
      }else drawBush(item.x,item.y);
    }
  }

  function loop(now){
    if(!running) return;
    const dt=Math.min((now-last)/1000,.033);last=now;
    update(dt);draw();requestAnimationFrame(loop);
  }

  function start(){
    resetPlayer();resetSlime();setScreen('game');running=true;last=performance.now();draw();requestAnimationFrame(loop);
  }
  function stop(){running=false;Object.keys(keys).forEach(k=>keys[k]=false);setScreen('title');}

  startBtn.addEventListener('click',start);
  backBtn.addEventListener('click',stop);

  const keyMap={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
  function pressDirection(dir){
    keys[dir]=true;
    const i=pressOrder.indexOf(dir);if(i>=0)pressOrder.splice(i,1);
    pressOrder.push(dir);
  }
  function releaseDirection(dir){
    keys[dir]=false;
    const i=pressOrder.indexOf(dir);if(i>=0)pressOrder.splice(i,1);
  }
  addEventListener('keydown',e=>{
    const k=keyMap[e.key];
    if(k){if(!keys[k])pressDirection(k);e.preventDefault();return;}
    if(e.key==='j'||e.key==='J'||e.code==='Space'){if(!e.repeat)fireWater();e.preventDefault();}
  });
  addEventListener('keyup',e=>{const k=keyMap[e.key];if(k){releaseDirection(k);e.preventDefault();}});

  const controls=document.getElementById('controls');

  // Android/iOSの長押し選択、コンテキストメニュー、ドラッグを抑止。
  ['contextmenu','selectstart','dragstart'].forEach(type=>{
    controls.addEventListener(type,e=>e.preventDefault());
  });
  controls.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  controls.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

  const actionBtn=document.getElementById('actionBtn');
  actionBtn.addEventListener('pointerdown',e=>{e.preventDefault();fireWater();});
  actionBtn.addEventListener('contextmenu',e=>e.preventDefault());

  document.querySelectorAll('.dir').forEach(btn=>{
    const dir=btn.dataset.dir;
    btn.setAttribute('aria-label',dir);
    const on=e=>{
      e.preventDefault();
      if(btn.setPointerCapture && e.pointerId!==undefined){
        try{btn.setPointerCapture(e.pointerId);}catch(_){}
      }
      pressDirection(dir);
    };
    const off=e=>{
      e.preventDefault();
      releaseDirection(dir);
    };
    btn.addEventListener('pointerdown',on);
    btn.addEventListener('pointerup',off);
    btn.addEventListener('pointercancel',off);
    btn.addEventListener('lostpointercapture',off);
  });
  draw();
})();
</script>
</body>
</html>
